name: build-and-push

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  DH_IMAGE: colinxu/caddy-fp
  GHCR_IMAGE: ghcr.io/xuzhonglin/caddy-fp

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: caddy-fp:test

      - name: Smoke test
        run: |
          docker run -d --name fp-test -p 18888:8888 \
            -v "$PWD/test-Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy-fp:test
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -x http://localhost:18888 http://httpbin.org/ip || true)
          echo "no-auth => $code (expect 407)"
          [ "$code" = "407" ] || { docker logs fp-test; exit 1; }
          ip=$(curl -s --max-time 20 \
            -x http://myuser:myStrongPass@localhost:18888 https://ipinfo.io/ip)
          echo "tunnel ip => $ip"
          [ -n "$ip" ] || { docker logs fp-test; exit 1; }
          docker rm -f fp-test >/dev/null

  push-multiarch:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Caddy version
        id: ver
        run: echo "version=$(cat .caddy-version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.DH_IMAGE }}:latest
            ${{ env.DH_IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.ver.outputs.version }}
